services:
  mysql:
    image: mysql:8.4
    container_name: dailyhelp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dailyhelp
      MYSQL_USER: dailyhelp
      MYSQL_PASSWORD: ${DB_PASSWORD:-dailyhelp_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
      TZ: UTC
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dailyhelp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  dailyhelp_mysql_data:
