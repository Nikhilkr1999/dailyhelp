server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/dailyhelp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:dailyhelp}
    password: ${DB_PASSWORD:dailyhelp_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
server.error.include-message: never
management.endpoints.web.exposure.include: health,info
management.endpoint.health.probes.enabled: true
app.cors.allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

server.servlet.session.cookie.http-only: true
server.servlet.session.cookie.secure: ${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site: ${SESSION_COOKIE_SAME_SITE:lax}
app.cookies.secure: ${SESSION_COOKIE_SECURE:false}
app.cookies.same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
